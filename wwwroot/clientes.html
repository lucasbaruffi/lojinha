<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="header">
        Sistema Lojinha
    </div>
    <div class="layout">
        <div class="sidebar">
            <h3>Menu</h3>
            <a href="/">
                Início
            </a>
            <a href="/clientes.html">
                Clientes
            </a>
            <a href="/pedidos.html">
                Pedidos
            </a>
        </div>
        <div class="content">

            <h2>Cadastrar Cliente</h2>

            <form id="form-cliente">

                <label>Nome</label>
                <input type="text" id="nome">

                <label>CPF</label>
                <input type="text" id="cpf">

                <label>Email</label>
                <input type="text" id="email">

                <label>Data de Nascimento</label>
                <input type="date" id="dtNascimento">

                <label>Endereço</label>
                <input type="text" id="endereco">

                <button type="submit">
                    Salvar Cliente
                </button>
            </form> 

            <br>
            <hr>
            <br>

            <h1>Clientes</h1>
            <button onclick="carregarClientes()">
                Atualizar
            </button>
            <br>
            <br>
            
            <p id="mensagem"></p>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Email</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="tabela-clientes">

                </tbody>
            </table>
        </div>
    </div>
    <script src="./js/clientes.js"></script>
</body>
</html>
