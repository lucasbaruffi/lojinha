<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="header">
        Sistema Lojinha
    </div>
    <div class="layout">
        <div class="sidebar">
            <h3>Menu</h3>
            <a href="/">
                Início
            </a>
            <a class="sidebar-selected" href="/clientes.html">
                Clientes
            </a>
            <a href="/pedidos.html">
                Pedidos
            </a>
        </div>
        <div class="content">

            <div class="container-card">
                <div style="display:flex;align-items:center;justify-content:space-between">
                    <h2 style="margin:0">Clientes</h2>
                    <div>
                        <button id="btn-novo-cliente" type="button">Novo Cliente</button>
                        <button onclick="carregarClientes()" style="margin-left:8px" type="button">Atualizar</button>
                    </div>
                </div>

                <form id="form-cliente" class="hidden" style="margin-top:16px">

                    <label>Nome</label>
                    <input type="text" id="nome">
                    <div class="field-error" id="error-nome"></div>

                    <label>CPF</label>
                    <input type="text" id="cpf" maxlength="14">
                    <div class="field-error" id="error-cpf"></div>

                    <label>Email</label>
                    <input type="text" id="email">
                    <div class="field-error" id="error-email"></div>

                    <label>Data de Nascimento</label>
                    <input type="date" id="dtNascimento">
                    <div class="field-error" id="error-dtNascimento"></div>

                    <label>Endereço</label>
                    <input type="text" id="endereco">
                    <div class="field-error" id="error-endereco"></div>

                    <p class="field-error" id="mensagem"></p>

                    <div style="display:flex;gap:8px">
                        <button type="submit">Salvar Cliente</button>
                        <button type="button" id="btn-cancelar-cliente" class="button-cancel">Cancelar</button>
                    </div>
                </form>
            </div>

            
            <br>
            <hr>
            <br>

            <br>
            

            <div class="container-card">
                <h3 style="margin-top:0">Lista de Clientes</h3>
                <div style="margin:12px 0; display:flex; gap:8px; align-items:center;">
                    <input id="busca-clientes" type="search" placeholder="Buscar por nome, CPF, email ou endereço" style="flex:1; padding:8px; border-radius:8px; border:1px solid rgba(0,0,0,0.08)">
                    <button id="btn-limpar-busca" type="button">Limpar</button>
                </div>
                <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Email</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="tabela-clientes">

                </tbody>
            </table>
                </div>
        </div>
    </div>

    <div id="confirm-modal" class="modal hidden">
        <div class="modal-dialog" style="width: min(400px, 100%);">
            <h3 id="confirm-titulo" style="margin-top: 0;">Confirmação</h3>
            <p id="confirm-mensagem"></p>
            <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px;">
                <button type="button" id="btn-confirm-cancelar" class="button-cancel">Cancelar</button>
                <button type="button" id="btn-confirm-confirmar" class="button-delete">Confirmar</button>
            </div>
        </div>
    </div>

    <div id="loading-overlay" class="loading-overlay hidden"><div class="spinner"></div></div>

    <script src="./js/clientes.js"></script>
</body>
</html>
