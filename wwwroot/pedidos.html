<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Pedidos</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="header">
        Sistema Lojinha
    </div>
    <div class="layout">
        <div class="sidebar">
            <h3>Menu</h3>
            <a href="/">
                Início
            </a>
            <a href="/clientes.html">
                Clientes
            </a>
            <a href="/pedidos.html">
                Pedidos
            </a>
        </div>
        <div class="content">

            <div class="container-card">
                <div style="display:flex;align-items:center;justify-content:space-between">
                    <h1 style="margin:0">Pedidos</h1>
                    <div>
                        <button id="btn-novo-pedido" type="button">Novo Pedido</button>
                    </div>
                </div>

                <form id="form-pedido" class="hidden" style="margin-top:16px">

                    <label>Cliente</label>

                    <select id="cliente"></select>

                    <h2>Itens</h2>

                    <div id="lista-itens"></div>

                    <div style="display:flex;gap:8px;align-items:center">
                        <button type="button" onclick="adicionarItem()">Adicionar Item</button>
                        <button type="submit">Salvar Pedido</button>
                        <button type="button" id="btn-cancelar-pedido">Cancelar</button>
                    </div>

                </form>
            </div>
            <br>
            <hr>
            <br>
                <h2>Pedidos Cadastrados</h2>
                <div id="lista-pedidos"></div>
        </div>
    </div>
    <script src="./js/pedidos.js"></script>
</body>
</html>
