<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Pedidos</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" type="image/x-icon" href="./assets/favicon.svg">
</head>

<body>
    <div class="header">
        Sistema Lojinha
    </div>
    <div class="layout">
        <div class="sidebar">
            <h3>Menu</h3>
            <a href="/">
                Início
            </a>
            <a href="/clientes.html">
                Clientes
            </a>
            <a class="sidebar-selected" href="/pedidos.html">
                Pedidos
            </a>
        </div>
        <div class="content">

            <div class="container-card">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
                    <div>
                        <h1 style="margin:0">Pedidos</h1>
                        <p id="mensagem-pedidos" class="field-error"></p>
                    </div>
                    <button id="btn-novo-pedido" type="button">Novo Pedido</button>
                </div>

                <div class="filtro-pedidos" style="margin-top:20px;">
                    <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
                        <input id="search-pedidos" type="search" placeholder="Buscar por pedido, cliente ou item" style="flex:1; min-width:220px;">
                        <button type="button" id="btn-limpar-filtro" class="button-cancel">Limpar filtro</button>
                    </div>
                    <div class="filtro-grid" style="margin-top:14px; gap:12px; display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
                        <input id="filtro-id" type="number" placeholder="ID do pedido">
                        <input id="filtro-cliente" type="text" placeholder="ID ou nome do cliente">
                        <input id="filtro-min-total" type="number" step="0.01" placeholder="Total mínimo">
                        <input id="filtro-max-total" type="number" step="0.01" placeholder="Total máximo">
                        <input id="filtro-data-inicio" type="date" placeholder="Data inicial">
                        <input id="filtro-data-fim" type="date" placeholder="Data final">
                    </div>
                </div>

                <div id="resumo-pedidos" style="margin-top:16px; font-weight:600; color:#334;"></div>

                <div id="form-pedido-modal" class="modal hidden">
                    <div class="modal-dialog">
                        <button class="modal-close" type="button" id="form-modal-close">×</button>

                        <form id="form-pedido">
                            <h2 id="form-pedido-title">Novo Pedido</h2>
                        <p id="pedido-mensagem" class="field-error"></p>

                            <label>Cliente</label>
                            <select id="cliente"></select>

                            <h2 style="margin-top:20px;">Itens</h2>

                            <div class="item-table-wrapper">
                                <table class="item-table">
                                    <thead>
                                        <tr>
                                            <th>Nome</th>
                                            <th>Quantidade</th>
                                            <th>Valor</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody id="pedido-itens-body"></tbody>
                                </table>
                            </div>

                            <div style="display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;">
                                <button type="button" id="btn-adicionar-item">Adicionar Item</button>
                                <button type="submit">Salvar Pedido</button>
                                <button type="button" id="btn-cancelar-pedido" class="button-cancel">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <br>
            <hr>
            <br>
            <div class="container-card">
                <h2 style="margin-top:0">Pedidos Cadastrados</h2>
                <div id="lista-pedidos"></div>
            </div>

            <div id="pedido-modal" class="modal hidden">
                <div class="modal-dialog">
                    <button class="modal-close" type="button">×</button>
                    <h3 id="modal-titulo">Pedido</h3>
                    <p id="modal-infos"></p>
                    <div class="modal-items-wrapper">
                        <table class="item-table modal-items-table">
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Quantidade</th>
                                    <th>Valor unitário</th>
                                    <th>Total</th>
                                </tr>
                            </thead>
                            <tbody id="modal-itens-body"></tbody>
                        </table>
                    </div>
                    <p id="modal-total" style="margin-top:16px; font-weight:700;"></p>
                </div>
            </div>

            <div id="confirm-modal" class="modal hidden">
                <div class="modal-dialog" style="width: min(400px, 100%);">
                    <h3 id="confirm-titulo" style="margin-top: 0;">Confirmação</h3>
                    <p id="confirm-mensagem"></p>
                    <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px;">
                        <button type="button" id="btn-confirm-cancelar" class="button-cancel">Cancelar</button>
                        <button type="button" id="btn-confirm-confirmar" class="button-delete">Confirmar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="loading-overlay" class="loading-overlay hidden"><div class="spinner"></div></div>

    <script src="./js/pedidos.js"></script>
</body>
</html>
